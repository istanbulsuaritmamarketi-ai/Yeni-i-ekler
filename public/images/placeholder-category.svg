    <path d="M 0 20 C 25 10 40 -15 30 -45 C 10 -35 0 -10 0 20 Z" fill="#2563eb"/>
    <path d="M 0 15 C -15 -15 -12 -55 0 -65 C 12 -55 15 -15 0 15 Z" fill="url(#catPetal)"/>
