<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="petalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="petalRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="597" rx="34.5" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Decorative subtle background circles -->
  <circle cx="300" cy="270" r="160" fill="#ffffff" opacity="0.6"/>
  <circle cx="300" cy="270" r="130" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Botanical Emblem Group -->
  <g filter="url(#softShadow)" transform="translate(0, -10)">
    <!-- Stem -->
    <path d="M 300 280 C 298 330 304 380 300 420" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Leaves -->
    <path d="M 299 350 C 265 345 240 330 235 305 C 260 305 285 325 299 350 Z" fill="#10b981" opacity="0.9"/>
    <path d="M 301 370 C 335 365 360 350 365 325 C 340 325 315 345 301 370 Z" fill="#059669" opacity="0.9"/>

    <!-- Center Tulip Flower -->
    <!-- Left Petal -->
    <path d="M 300 270 C 265 255 240 215 250 170 C 275 190 295 230 300 270 Z" fill="url(#petalBlue)"/>
    <!-- Right Petal -->
    <path d="M 300 270 C 335 255 360 215 350 170 C 325 190 305 230 300 270 Z" fill="url(#petalBlue)"/>
    <!-- Center Petal -->
    <path d="M 300 260 C 280 220 285 160 300 145 C 315 160 320 220 300 260 Z" fill="url(#petalRose)"/>
  </g>

  <!-- Typography / Brand Fallback Label -->
  <text x="300" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#1e293b" letter-spacing="1.5">
    YENİÇİÇEK
  </text>
  <text x="300" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.5">
    Görsel Yakında Eklenecek
  </text>
</svg>
